[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguardian"
version = "0.1.0"
description = "Data profiling and quality assessment library"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]